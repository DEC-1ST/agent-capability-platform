name: protocol

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned CI tools
        run: python -m pip install --disable-pip-version-check --no-input -r requirements-ci.txt
      - name: Install protocol package
        run: python -m pip install --disable-pip-version-check --no-input --no-deps -e .
      - name: Run tests
        env:
          PYTHONPATH: packages/agent-protocol/src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile Python files
        run: python -m compileall -q packages tests tools
      - name: Public repository gate
        run: python tools/repository_gate.py
      - name: Ruff
        run: ruff check packages tests tools
